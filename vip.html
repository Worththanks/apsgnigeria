<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-style" content="black-translucent">
    <meta name="theme-color" content="#006400">
    <title>APSG Guest Scanner + Analytics</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: #e2e8f0;
            font-family: 'Roboto', sans-serif;
            overflow-y: auto;
            touch-action: manipulation;
        }
        .container-fluid {
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .header {
            text-align: center;
            padding: 0.6rem 0;
            flex-shrink: 0;
        }
        .header img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #10b981;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            object-fit: cover;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #10b981;
            margin: 0.5rem 0 0.2rem;
            word-break: break-word;
        }
        .header p {
            font-size: 1rem;
            color: #94a3b8;
            margin: 0.2rem 0;
        }
        .scanner-container {
            flex: 1;
            position: relative;
            min-height: 45vh;
            margin: 0.5rem 0;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            background: #000;
        }
        #reader {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border-color: #10b981;
            border-style: solid;
            border-width: 8px;
        }
        .top-left { top: 12%; left: 12%; border-width: 8px 0 0 8px; }
        .top-right { top: 12%; right: 12%; border-width: 8px 8px 0 0; }
        .bottom-left { bottom: 12%; left: 12%; border-width: 0 0 8px 8px; }
        .bottom-right { bottom: 12%; right: 12%; border-width: 0 8px 8px 0; }
        .scan-hint {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-size: 1.2rem;
            color: #fff;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #result {
            flex-shrink: 0;
            padding: 0.8rem;
            min-height: 160px;
            width: 100%;
        }
        .torch-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 20;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 2.2rem;
            border: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .controls {
            flex-shrink: 0;
            padding: 0.5rem 0;
        }
        .btn-lg {
            padding: 1.2rem;
            font-size: 1.3rem;
            min-height: 64px;
            border-radius: 50px;
            width: 100%;
            margin-bottom: 0.8rem;
        }
        .upload-btn {
            padding: 1.2rem;
            font-size: 1.3rem;
            min-height: 64px;
            border-radius: 50px;
            width: 100%;
        }
        .ready-text {
            font-size: 1.2rem;
            padding: 1rem;
        }

        @media (max-width: 480px) {
            .header img { width: 80px; height: 80px; }
            .header h1 { font-size: 1.6rem; }
            .corner { width: 50px; height: 50px; border-width: 6px; }
            .torch-btn { width: 64px; height: 64px; font-size: 2rem; }
            .scan-hint { font-size: 1.1rem; padding: 0.7rem 1.4rem; }
        }

        /* ==================== PREMIUM ACCESS CARD ==================== */
        .premium-access-card {
            background: linear-gradient(135deg, #0a1a2f 0%, #112240 100%);
            border-radius: 28px;
            border: 2px solid #d4af37;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(212,175,55,0.15);
            padding: 2rem 1.5rem;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .premium-access-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.15), transparent 70%);
            pointer-events: none;
        }
        .card-header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
        }
        .logo-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #d4af37;
            box-shadow: 0 8px 25px rgba(212,175,55,0.4);
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ribbon {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 100px;
            height: 100px;
            overflow: hidden;
        }
        .ribbon-top-left::before,
        .ribbon-top-left::after {
            content: '';
            position: absolute;
            border: 50px solid #d4af37;
        }
        .ribbon-top-left::before { top: 0; left: 0; border-left-color: transparent; border-bottom-color: transparent; }
        .ribbon-top-left::after { top: 0; right: 0; border-right-color: transparent; border-bottom-color: transparent; }
        .ribbon span {
            position: absolute;
            top: 18px;
            left: -28px;
            transform: rotate(-45deg);
            background: #d4af37;
            color: #000;
            font-weight: bold;
            padding: 6px 40px;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .premium-badge {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 1.5rem 0;
            box-shadow: 0 10px 30px rgba(16,185,129,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .badge-icon { font-size: 2.4rem; }
        .premium-guest-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            color: #d4af37;
            margin: 1.5rem 0 1.8rem;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .premium-welcome {
            font-size: 1.6rem;
            color: #e2e8f0;
            margin: 0 0 0.5rem;
            line-height: 1.6;
        }
        .premium-role {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: bold;
            color: #d4af37;
            margin: 0 0 2.5rem;
            line-height: 1.3;
            word-break: break-word;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .org-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #34d399;
            margin: 0.5rem 0;
        }
        .event-date {
            font-size: 1.6rem;
            font-weight: bold;
            color: #d4af37;
            margin: 0.5rem 0;
        }
        .event-slogan {
            font-size: 1.5rem;
            color: #94a3b8;
            margin: 0.5rem 0 2rem;
        }
        .checkin-info {
            margin: 2rem 0 0;
            color: #94a3b8;
            font-size: 1.2rem;
        }
        .checkin-info .label {
            display: block;
            margin-bottom: 0.4rem;
        }
        .checkin-info .time {
            color: #d4af37;
            font-weight: bold;
            font-size: 1.6rem;
        }
        .premium-next-btn {
            background: transparent;
            border: 3px solid #d4af37;
            color: #d4af37;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 64px;
            transition: all 0.3s ease;
        }
        .premium-next-btn:hover,
        .premium-next-btn:active {
            background: #d4af37;
            color: #000;
        }
        .card-footer {
            margin-top: 2.5rem;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        /* Analytics Button */
        .analytics-btn {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
            padding: 1rem;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 64px;
        }
        /* Analytics Modal */
        .analytics-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 1rem;
            overflow-y: auto;
        }
        .analytics-content {
            background: #112240;
            border-radius: 24px;
            padding: 2rem;
            color: #e2e8f0;
        }
        .analytics-chart {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            margin: 1.5rem 0;
        }
        .close-analytics {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
        @media (max-width: 480px) {
            .analytics-content { padding: 1.5rem; }
            .analytics-chart { padding: 0.8rem; }
        }
    </style>
</head>
<body>
    <audio id="vipSound" src="https://apsgnigeria.org/assets/sounds/vip-chime.mp3" preload="auto"></audio>

    <div class="container-fluid">
        <div class="header">
            <img src="https://apsgnigeria.org/assets/images/apsg.png" alt="APSG Logo">
            <h1>APC Progressive Support Group</h1>
            <p>2027 and Beyond</p>
        </div>

        <p class="text-center text-light mb-3 fw-medium">Scan VIP QR code to validate entry</p>

        <div class="scanner-container">
            <div id="reader"></div>
            <div class="scan-overlay">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="scan-hint">Position QR code inside frame</div>
            </div>
            <button id="torchBtn" class="torch-btn" style="display:none;">💡</button>
        </div>

        <div id="result" class="text-center">
            <p class="ready-text">Ready – tap Start to begin scanning</p>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-success btn-lg shadow">Start Camera Scanner</button>
            <button id="stopBtn" class="btn btn-danger btn-lg" style="display:none;">Stop Scanner</button>
            <button id="analyticsBtn" class="btn analytics-btn shadow mt-3">View Event Analytics</button>
        </div>

        <div class="text-center">
            <label for="qrInputFile" class="btn btn-outline-light btn-lg upload-btn shadow">
                📷 Upload QR Code Image<br>
                <small class="opacity-75">From gallery or take photo</small>
            </label>
            <input type="file" id="qrInputFile" accept="image/*" capture="environment" style="display:none;">
        </div>
    </div>

    <!-- Analytics Modal -->
    <div id="analyticsModal" class="analytics-modal">
        <div class="analytics-content">
            <h2 class="text-center text-warning mb-4">Event Analytics Dashboard</h2>
            <div id="analyticsSummary" class="text-center mb-4"></div>
            <div class="analytics-chart">
                <canvas id="roleChart"></canvas>
            </div>
            <button class="btn close-analytics w-100">Close Dashboard</button>
            <button id="exportCsv" class="btn btn-outline-warning w-100 mt-2">Export CSV Report</button>
        </div>
    </div>

    <script>
        const scanner = new Html5Qrcode("reader");
        const resultDiv = document.getElementById("result");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const torchBtn = document.getElementById("torchBtn");
        const vipSound = document.getElementById("vipSound");
        const analyticsBtn = document.getElementById("analyticsBtn");
        const analyticsModal = document.getElementById("analyticsModal");
        const exportCsv = document.getElementById("exportCsv");

        let isTorchOn = false;
        let runningTrack = null;
        let isCameraActive = false;

        // Analytics Storage
        let scans = JSON.parse(localStorage.getItem('apsgScans') || '[]');

        function saveScans() {
            localStorage.setItem('apsgScans', JSON.stringify(scans));
        }

        function getQrbox(viewfinderWidth, viewfinderHeight) {
            const size = Math.min(viewfinderWidth, viewfinderHeight) * 0.75;
            return { width: Math.floor(size), height: Math.floor(size) };
        }

        const config = {
            fps: 20,
            qrbox: getQrbox,
            aspectRatio: 1,
            facingMode: "environment",
            disableFlip: false
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function triggerConfetti() {
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#10b981', '#34d399', '#6ee7b7', '#d4af37', '#ffffff']
            });
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        function logScan(name, role) {
            const timestamp = new Date().toISOString();
            scans.push({ name: name.trim(), role: role.trim() || 'Distinguished Guest', timestamp });
            saveScans();
        }

        function showSuccess(decodedText) {
            vipSound.play().catch(() => {});
            triggerConfetti();
            vibrate();

            if (isCameraActive) scanner.pause(true);

            let name = "Distinguished Guest";
            let role = "";

            const trimmedText = decodedText.trim();
            const apsgMatch = trimmedText.match(/Access Granted:\s*(.+?)\s*[–-]\s*APC Progressive Support Group/i);
            if (apsgMatch) {
                const guestInfo = apsgMatch[1].trim();

                const levelKeywords = ['National', 'State', 'Local', 'Zonal', 'Ward'];
                let splitIndex = -1;
                let bestKeyword = '';

                levelKeywords.forEach(keyword => {
                    const idx = guestInfo.lastIndexOf(` ${keyword} `);
                    if (idx > splitIndex) {
                        splitIndex = idx;
                        bestKeyword = keyword;
                    }
                });

                if (splitIndex > -1) {
                    name = guestInfo.substring(0, splitIndex).trim();
                    role = guestInfo.substring(splitIndex + bestKeyword.length + 2).trim();
                } else {
                    name = guestInfo;
                    role = "Distinguished Guest";
                }
            } else {
                name = trimmedText || name;
                role = "Distinguished Guest";
            }

            logScan(name, role);

            const checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            resultDiv.innerHTML = `
                <div class="premium-access-card">
                    <div class="card-header">
                        <div class="ribbon ribbon-top-left"><span>VIP</span></div>
                        <div class="logo-circle">
                            <img src="https://apsgnigeria.org/assets/images/apsg.png" alt="APSG">
                        </div>
                    </div>

                    <div class="card-body text-center">
                        <div class="access-badge premium-badge" aria-live="polite">
                            <span class="badge-text">ACCESS GRANTED</span>
                            <span class="badge-icon">✓</span>
                        </div>

                        <h2 class="premium-guest-name">
                            ${escapeHtml(name)}
                        </h2>

                        <p class="premium-welcome">
                            Welcome to 2027 and Beyond<br>
                            as our
                        </p>

                        <h3 class="premium-role">
                            ${escapeHtml(role)}
                        </h3>

                        <div class="org-name">APC Progressive Support Group</div>
                        <div class="event-date">12 February 2027</div>
                        <div class="event-slogan">2027 and Beyond</div>

                        <div class="checkin-info">
                            <span class="label">Validated at:</span>
                            <span class="time">${checkInTime}</span>
                        </div>

                        <div class="mt-5">
                            <button id="nextGuestBtn" class="btn premium-next-btn" type="button">
                                Ready for Next Guest
                            </button>
                        </div>
                    </div>

                    <div class="card-footer">
                        <div class="footer-text">APC Progressive Support Group Nigeria • 2027 & Beyond</div>
                    </div>
                </div>
            `;

            document.getElementById('nextGuestBtn')?.addEventListener('click', resetResult);
            if (isCameraActive) setTimeout(resetResult, 40000);
        }

        function resetResult() {
            resultDiv.innerHTML = '<p class="ready-text">Ready for next guest</p>';
            if (isCameraActive) scanner.resume();
        }

        function onScanSuccess(decodedText) {
            showSuccess(decodedText);
        }

        function onScanError() {}

        torchBtn.addEventListener('click', () => {
            if (!runningTrack) return;
            const capabilities = runningTrack.getCapabilities();
            if ('torch' in capabilities) {
                isTorchOn = !isTorchOn;
                runningTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                torchBtn.textContent = isTorchOn ? '🔆' : '💡';
            }
        });

        startBtn.addEventListener("click", () => {
            isCameraActive = true;
            scanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                startBtn.style.display = "none";
                stopBtn.style.display = "block";
                resultDiv.innerHTML = '<p class="ready-text">Scanning... Hold steady</p>';

                runningTrack = scanner.getRunningTrack();
                if (runningTrack?.getCapabilities()?.torch) {
                    torchBtn.style.display = "block";
                }
            }).catch(err => {
                isCameraActive = false;
                resultDiv.innerHTML = `<div class="alert alert-danger rounded-pill p-3 mx-2">Camera error: ${err}<br><small>Allow permission & reload</small></div>`;
            });
        });

        stopBtn.addEventListener("click", () => {
            scanner.stop().then(() => {
                startBtn.style.display = "block";
                stopBtn.style.display = "none";
                torchBtn.style.display = "none";
                isTorchOn = false;
                isCameraActive = false;
                resetResult();
            });
        });

        document.getElementById('qrInputFile').addEventListener('change', e => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            resultDiv.innerHTML = '<p class="ready-text">Processing uploaded image...</p>';
            scanner.scanFileV2(file, true)
                .then(res => onScanSuccess(res.decodedText))
                .catch(err => {
                    resultDiv.innerHTML = `<div class="alert alert-danger rounded-pill p-3 mx-2">Scan failed: ${err}<br><small>Try a clearer image</small></div>`;
                });
        });

        // ==================== ANALYTICS IMPLEMENTATION ====================
        analyticsBtn.addEventListener('click', () => {
            analyticsModal.style.display = 'flex';
            renderAnalytics();
        });

        document.querySelector('.close-analytics').addEventListener('click', () => {
            analyticsModal.style.display = 'none';
        });

        exportCsv.addEventListener('click', () => {
            let csv = 'Name,Role,Timestamp\n';
            scans.forEach(scan => {
                csv += `"${scan.name}","${scan.role}","${scan.timestamp}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'apsg-event-analytics.csv';
            a.click();
        });

        let roleChart = null;

        function renderAnalytics() {
            if (scans.length === 0) {
                document.getElementById('analyticsSummary').innerHTML = '<p class="text-warning">No scans yet</p>';
                return;
            }

            const uniqueGuests = new Set(scans.map(s => s.name + s.role)).size;
            const totalScans = scans.length;

            const roleCounts = {};
            scans.forEach(scan => {
                const r = scan.role || 'Other';
                roleCounts[r] = (roleCounts[r] || 0) + 1;
            });

            document.getElementById('analyticsSummary').innerHTML = `
                <h4>Total Scans: <span class="text-warning">${totalScans}</span></h4>
                <h4>Unique Guests: <span class="text-warning">${uniqueGuests}</span></h4>
            `;

            const ctx = document.getElementById('roleChart').getContext('2d');
            if (roleChart) roleChart.destroy();

            roleChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(roleCounts),
                    datasets: [{
                        data: Object.values(roleCounts),
                        backgroundColor: ['#10b981', '#34d399', '#6ee7b7', '#d4af37', '#94a3b8', '#64748b'],
                        borderWidth: 2,
                        borderColor: '#000'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#e2e8f0' } },
                        title: { display: true, text: 'Scans by Role', color: '#d4af37', font: { size: 18 } }
                    }
                }
            });
        }
    </script>

    <div class="text-center text-light small opacity-70 fixed-bottom pb-3 px-2">
        <p>Back camera • Good light • Hold 15–20cm away</p>
    </div>
</body>
</html>
