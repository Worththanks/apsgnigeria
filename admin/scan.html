<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-style" content="black-translucent">
    <meta name="theme-color" content="#006400">
    <title>APSG Guest Scanner</title>

        <!-- Favicon -->
    <link rel="icon" href="/assets/images/logo/apsg1.png" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/images/logo/apsg1.png" />
    <link rel="icon" href="/assets/images/logo/apsg.png" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/logo/apsg.png">

    <link rel="icon" href="/assets/images/logo/apsg1.png" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/logo/apsg1.png">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    

       <link rel="stylesheet" href="/assets/css/styles.css">
        <link rel="stylesheet" href="/assets/css/dashboard.css">
    <style>
       
    </style>
  <link rel="stylesheet" href="/assets/css/admin-unified.css">
  <link rel="stylesheet" href="/assets/css/deployment-polish.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-clients.js"></script>
</head>
<body>
    <audio id="vipSound" preload="none" aria-hidden="true"></audio>

    <div class="container-fluid">
        <div class="header">
            <img src="/assets/images/logo/apsg1.png" alt="APSG Logo">
            <h1>APC Progressive Support Group</h1>
            <p>2027 and Beyond</p>
        </div>

        <p class="text-center text-light mb-3 fw-medium">Scan QRCode to Validate Entry</p>

        <div class="scanner-container">
            <div id="reader"></div>
            <div class="scan-overlay">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="scan-hint">Position QR code inside frame</div>
            </div>
            <button id="torchBtn" class="torch-btn" style="display:none;">💡</button>
        </div>

        <div id="result" class="text-center">
            <p class="ready-text">Ready – tap Start to begin scanning</p>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-success btn-lg shadow">Start Camera Scanner</button>
            <button id="stopBtn" class="btn btn-danger btn-lg" style="display:none;">Stop Scanner</button>
        </div>

        <div class="text-center">
            <label for="qrInputFile" class="btn btn-outline-light btn-lg upload-btn shadow">
                📷 Upload QR Code Image<br>
                <small class="opacity-75">From gallery or take photo</small>
            </label>
            <input type="file" id="qrInputFile" accept="image/*" capture="environment" style="display:none;">
        </div>
    </div>

    <script>
        const scanner = new Html5Qrcode("reader");
        const resultDiv = document.getElementById("result");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const torchBtn = document.getElementById("torchBtn");
        const vipSound = document.getElementById("vipSound");

        let isTorchOn = false;
        let runningTrack = null;
        let isCameraActive = false; // Flag to track if camera is running

        function getQrbox(viewfinderWidth, viewfinderHeight) {
            const size = Math.min(viewfinderWidth, viewfinderHeight) * 0.75;
            return { width: Math.floor(size), height: Math.floor(size) };
        }

        const config = {
            fps: 20,
            qrbox: getQrbox,
            aspectRatio: 1,
            facingMode: "environment",
            disableFlip: false
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function triggerConfetti() {
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#10b981', '#34d399', '#6ee7b7', '#d4af37', '#ffffff']
            });
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        function showSuccess(decodedText) {
    vipSound.play().catch(() => {});
    triggerConfetti();
    vibrate();

    if (isCameraActive) {
        scanner.pause(true); // Only pause if camera is active
    }

    let name = "";
    let role = "";

    const trimmedText = decodedText.trim();

    const apsgMatch = trimmedText.match(/Access Granted:\s*(.+?)\s*[–-]\s*APC Progressive Support Group/i);
    if (apsgMatch) {
        let guestInfo = apsgMatch[1].trim();

        // Split by the last occurrence of ' - ' or ' – ' to separate name and role
        const dashRegex = /\s*[\-\–]\s*/;
        const lastDashIndex = guestInfo.lastIndexOf(' - ');
        const lastEnDashIndex = guestInfo.lastIndexOf(' – ');
        const splitIndex = Math.max(lastDashIndex, lastEnDashIndex);

        if (splitIndex > -1) {
            name = guestInfo.substring(0, splitIndex).trim();
            role = guestInfo.substring(splitIndex + 3).trim(); // +3 to skip ' - ' or ' – '
        } else {
            // Fallback to keyword-based split if no dash found
            const levelKeywords = ['National', 'State', 'Local', 'Zonal', 'Ward', 'Special', 'Guest']; // Expanded keywords for better matching
            let keywordSplitIndex = -1;
            let bestKeyword = '';

            levelKeywords.forEach(keyword => {
                const idx = guestInfo.lastIndexOf(` ${keyword} `);
                if (idx > keywordSplitIndex) {
                    keywordSplitIndex = idx;
                    bestKeyword = keyword;
                }
            });

            if (keywordSplitIndex > -1) {
                name = guestInfo.substring(0, keywordSplitIndex).trim();
                role = guestInfo.substring(keywordSplitIndex + 1).trim(); // +1 to include the keyword in role
            } else {
                name = guestInfo;
                role = "";
            }
        }

        // Clean up any trailing dashes or spaces from name and role
        name = name.replace(/[\s\-\–]+$/g, '').trim();
        role = role.replace(/^[\s\-\–]+/g, '').trim();
    } else {
        name = trimmedText || name;
        role = "";
    }

    if (!role) role = "";

    const checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    resultDiv.innerHTML = `
        <div class="premium-access-card">
            <div class="card-header">
                <div class="ribbon ribbon-top-left"><span>VIP</span></div>
                <div class="logo-circle">
                    <img src="/assets/images/logo/apsg1.png" alt="APSG">
                </div>
            </div>

            <div class="card-body text-center">
                <div class="access-badge premium-badge" aria-live="polite">
                    <span class="badge-text">ACCESS GRANTED</span>
                    <span class="badge-icon">✓</span>
                </div>

                <p class="premium-welcome">Welcome to 2027 and Beyond</p>
                <h1 class="premium-guest-name">${escapeHtml(name)}</h1>
                <p class="premium-our">our</p>
                <h2 class="premium-role">${escapeHtml(role)}</h2>
                <br><br> <!-- Blank lines for spacing -->

                <div class="org-name">APC Progressive Support Group</div>
                <div class="event-type">Verification Console</div>
                <div class="event-slogan">2027 and Beyond</div>
                <div class="event-date">Event date managed by APSG Admin</div>

                <div class="checkin-info">
                    <span class="label">Validated at:</span>
                    <span class="time">${checkInTime}</span>
                </div>

                <div class="mt-5">
                    <button id="nextGuestBtn" class="btn premium-next-btn" type="button">
                        Ready for Next Guest
                    </button>
                </div>
            </div>

            <div class="card-footer">
                <div class="footer-text">APC Progressive Support Group Nigeria • 2027 & Beyond</div>
            </div>
        </div>
    `;

    document.getElementById('nextGuestBtn')?.addEventListener('click', resetResult);

    // Auto reset only if camera is active
    if (isCameraActive) {
        setTimeout(resetResult, 40000);
    }
}

        function resetResult() {
            resultDiv.innerHTML = '<p class="ready-text">Ready for next guest</p>';
            if (isCameraActive) {
                scanner.resume();
            }
        }

        function onScanSuccess(decodedText) {
            showSuccess(decodedText);
        }

        function onScanError() {
            // Silent
        }

        torchBtn.addEventListener('click', () => {
            if (!runningTrack) return;
            const capabilities = runningTrack.getCapabilities();
            if ('torch' in capabilities) {
                isTorchOn = !isTorchOn;
                runningTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                torchBtn.textContent = isTorchOn ? '🔆' : '💡';
            }
        });

        startBtn.addEventListener("click", () => {
            isCameraActive = true;
            scanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                startBtn.style.display = "none";
                stopBtn.style.display = "block";
                resultDiv.innerHTML = '<p class="ready-text">Scanning... Hold steady</p>';

                runningTrack = scanner.getRunningTrack();
                if (runningTrack?.getCapabilities()?.torch) {
                    torchBtn.style.display = "block";
                }
            }).catch(err => {
                isCameraActive = false;
                resultDiv.innerHTML = `<div class="alert alert-danger rounded-pill p-3 mx-2">Camera error: ${err}<br><small>Allow permission & reload</small></div>`;
            });
        });

        stopBtn.addEventListener("click", () => {
            scanner.stop().then(() => {
                startBtn.style.display = "block";
                stopBtn.style.display = "none";
                torchBtn.style.display = "none";
                isTorchOn = false;
                isCameraActive = false;
                resetResult();
            });
        });

        document.getElementById('qrInputFile').addEventListener('change', e => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            resultDiv.innerHTML = '<p class="ready-text">Processing uploaded image...</p>';
            scanner.scanFileV2(file, true)
                .then(res => onScanSuccess(res.decodedText))
                .catch(err => {
                    resultDiv.innerHTML = `<div class="alert alert-danger rounded-pill p-3 mx-2">Scan failed: ${err}<br><small>Try a clearer image or different angle</small></div>`;
                });
        });
    </script>

    <div class="text-center text-light small opacity-70 fixed-bottom pb-3 px-2">
        <p>Back camera • Good light • Hold 15–20cm away</p>
    </div>
  <script src="/assets/js/admin-auth.js"></script>
  <script src="/assets/js/admin-unified.js" defer></script>
  <script src="/assets/js/deployment-polish.js" defer></script>
</body>
</html>
