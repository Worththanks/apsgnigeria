<body class="gallery-page min-h-screen flex flex-col">
  <div id="navbar" role="navigation" aria-label="Main Navigation"></div>

  <main class="flex-grow">
    <section class="gallery-hero px-4 pt-32 pb-20 md:pt-40 md:pb-24 text-white">
      <div class="relative z-10 max-w-7xl mx-auto grid lg:grid-cols-[1.08fr_.92fr] gap-8 items-center">
        <div>
          <span class="gallery-chip"><i class="fa-solid fa-images text-[#d6a92b]"></i> APSG Official Media Gallery</span>
          <h1 class="display-font mt-6 text-4xl md:text-7xl font-black leading-[.95] tracking-tight">Photo & Video Albums</h1>
          <p class="mt-6 max-w-2xl text-white/82 text-lg md:text-xl leading-relaxed">Explore APSG event memories, inaugurations, chapter activities, meetings and mobilisation media loaded from Google Drive and grouped by official events.</p>
          <div class="mt-8 flex flex-wrap gap-3">
            <a href="#galleryApp" class="gallery-btn gold"><i class="fa-solid fa-folder-open"></i>Browse Albums</a>
            <a href="/pages/events.html" class="gallery-btn white"><i class="fa-solid fa-calendar-check"></i>View Events</a>
            <button type="button" class="gallery-btn white" onclick="navigator.share ? navigator.share({title:document.title,url:location.href}) : navigator.clipboard?.writeText(location.href)"><i class="fa-solid fa-share-nodes"></i>Share</button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="gallery-stat p-5 text-center"><p class="text-xs uppercase tracking-widest text-white/55 font-black">Albums</p><p class="text-4xl font-black" data-gallery-stat="albums">0</p></div>
          <div class="gallery-stat p-5 text-center"><p class="text-xs uppercase tracking-widest text-white/55 font-black">Events</p><p class="text-4xl font-black" data-gallery-stat="events">0</p></div>
          <div class="gallery-stat p-5 text-center"><p class="text-xs uppercase tracking-widest text-white/55 font-black">Photos</p><p class="text-4xl font-black" data-gallery-stat="photos">0</p></div>
          <div class="gallery-stat p-5 text-center"><p class="text-xs uppercase tracking-widest text-white/55 font-black">Videos</p><p class="text-4xl font-black" data-gallery-stat="videos">0</p></div>
        </div>
      </div>
    </section>

    <section class="px-4 py-12 md:py-16">
      <div id="galleryApp" class="max-w-7xl mx-auto"></div>
    </section>
