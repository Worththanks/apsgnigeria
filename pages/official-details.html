      <div class="hero-grid-pattern"></div>
      <div class="relative z-10 max-w-7xl mx-auto px-4 md:px-6">
        <div class="grid lg:grid-cols-[1fr_.72fr] gap-5 items-center compact-hero-layout">
          <div>
            <span class="official-chip dark"><i class="fa-solid fa-spinner fa-spin"></i> Loading Official Dossier</span>
            <h2 class="display-font mt-4 text-4xl md:text-5xl lg:text-6xl font-black leading-[.95] tracking-tight">Preparing premium profile...</h2>
            <p class="mt-3 max-w-2xl text-white/72 text-sm md:text-base leading-relaxed">Connecting to APSG leadership records and building the official public dossier.</p>
            <div class="mt-5 grid sm:grid-cols-3 gap-2 max-w-2xl">
              <div class="skeleton h-16 rounded-2xl"></div><div class="skeleton h-16 rounded-2xl"></div><div class="skeleton h-16 rounded-2xl"></div>
            </div>
          </div>
          <div class="glass-card compact-hero-card">
            <div class="skeleton h-[25rem] rounded-[1.2rem]"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    window.APSG_OFFICIALS_TABLES = window.APSG_OFFICIALS_TABLES || ['apsg_officials','officials','leadership_officials'];
    const FALLBACK_IMAGE = '/assets/images/logo/apsg.png';

    const qs = new URLSearchParams(window.location.search);
    const requestedId = qs.get('id') || '';
    const requestedSlug = qs.get('slug') || '';
    const requestedProfile = qs.get('profile') || qs.get('profile_slug') || '';
    const root = document.getElementById('officialDetailsRoot');

    function escapeHtml(value) {
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function text(value, fallback = 'Not specified') { return String(value || '').trim() || fallback; }
    function pretty(value) {
      return text(value, '').replace(/_/g, ' ').replace(/\b\w/g, s => s.toUpperCase()) || 'Official';
    }
    function slugify(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'official';
    }
    function profileKey(record) {
      return String(record.profile_slug || record.profile_key || '').trim() || slugify(String(record.slug || record.full_name || '').replace(/^(apsg|cwdi)[-_](board[-_]bot|patrons|matrons|executive[-_]directors|executive[-_]leadership)[-_]/i, ''));
    }
    function formatCredentialList(value) {
      const lines = String(value || '').split(/\n+/).map(line => line.replace(/^[-•*]+\s*/, '').trim()).filter(Boolean);
      if (!lines.length) return '<p>Credentials and appointment notes will appear here once updated from the Admin Leadership Desk.</p>';
      if (lines.length < 3) return lines.map(line => `<p>${escapeHtml(line)}</p>`).join('');
      return '<ul class="dossier-rich-list">' + lines.map(line => `<li>${escapeHtml(line)}</li>`).join('') + '</ul>';
    }
    function formatParagraphs(value) {
      const paragraphs = String(value || '').split(/\n\s*\n+/).map(block => block.trim()).filter(Boolean);
      if (!paragraphs.length) return '<p>Full biography and official dossier will appear here once updated from the Admin Leadership Desk.</p>';
      return paragraphs.map(block => `<p>${escapeHtml(block).replace(/\n/g, '<br>')}</p>`).join('');
    }
    function getClient() {
      return window.supabaseClient || window.apsgSupabase || window.APSG_SUPABASE || window.supabase;
    }
    function getImage(record) {
      return record.image_url || record.photo_url || record.avatar_url || record.image || record.photo || FALLBACK_IMAGE;
    }
    function getTargets(record) {
      const raw = record.publish_targets || record.publishTargets || record.targets || [];
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string') {
        try { const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed : raw.split(',').map(x=>x.trim()).filter(Boolean); }
        catch { return raw.split(',').map(x=>x.trim()).filter(Boolean); }
      }
      return [];
    }
    function buildBackLink(record) {
      const targets = getTargets(record);
      if (targets.includes('mp')) return '/pages/mp.html';
      if (targets.includes('national_executive')) return '/pages/nat-exec.html';
      if (targets.includes('state_executive')) return '/pages/state.html';
      return '/pages/leadership.html';
    }
    function copyDossier(record) {
      const body = [
        text(record.full_name || record.name, 'Official'),
        text(record.position || record.designation || record.role, ''),
        text(record.short_info || record.excerpt || record.summary, ''),
        text(record.credentials, ''),
        text(record.biography || record.bio || record.dossier, ''),
        'Placements:',
        ...(record.__placements || []).map(item => `- ${(item.organization_key || item.organization || 'APSG').toUpperCase()} / ${pretty(item.leadership_group || item.section_key || item.category)} / ${item.position || 'Official'}`)
      ].filter(Boolean).join('\n\n');
      navigator.clipboard?.writeText(body).then(() => showToast('Dossier copied'));
    }
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 left-1/2 z-[200] -translate-x-1/2 rounded-full bg-[#05351f] px-5 py-3 text-sm font-black text-white shadow-2xl no-print';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1700);
    }

    async function queryTable(table, id, slug) {
      const client = getClient();
      if (!client || !client.from) throw new Error('Supabase client is not available.');
      if (requestedProfile) {
        const byProfile = await client.from(table).select('*').eq('profile_slug', requestedProfile).order('canonical_profile', { ascending: false }).limit(1);
        if (!byProfile.error && byProfile.data && byProfile.data[0]) return byProfile.data[0];
      }
      if (id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
        const byId = await client.from(table).select('*').eq('id', id).maybeSingle();
        if (byId.data) return byId.data;
      }
      if (slug) {
        const bySlug = await client.from(table).select('*').eq('slug', slug).maybeSingle();
        if (bySlug.data) return bySlug.data;
      }
      if (id) {
        const bySlugId = await client.from(table).select('*').eq('slug', id).maybeSingle();
        if (bySlugId.data) return bySlugId.data;
      }
      return null;
    }

    async function loadProfilePlacements(table, record) {
      const client = getClient();
      const key = profileKey(record);
      if (!client || !client.from || !key) return [record];
      try {
        const res = await client.from(table).select('*').eq('profile_slug', key).order('display_order', { ascending: true });
        if (!res.error && Array.isArray(res.data) && res.data.length) {
          const seen = new Set();
          return res.data.filter(item => {
            const pkey = item.placement_key || item.id || `${item.organization_key || item.organization}:${item.leadership_group || item.section_key}:${item.position}`;
            if (seen.has(pkey)) return false;
            seen.add(pkey);
            return true;
          });
        }
      } catch (error) {}
      return [record];
    }

    async function loadOfficial() {
      let lastError = null;
      await new Promise(resolve => setTimeout(resolve, 120));
      for (const table of window.APSG_OFFICIALS_TABLES) {
        try {
          const record = await queryTable(table, requestedId, requestedSlug);
          if (record) { const placements = await loadProfilePlacements(table, record); renderOfficial(record, table, placements); return; }
        } catch (error) { lastError = error; }
      }
      renderError(lastError);
    }

    function renderOfficial(record, table, placements = [record]) {
      const name = text(record.full_name || record.name, 'APSG Official');
      const role = text(record.position || record.designation || record.role, 'Leadership Official');
      const category = pretty(record.category || record.level || 'leadership');
      const seat = text(record.seat || record.council || record.level, 'APSG Leadership Council');
      const state = text(record.state, 'National / Not state specific');
      const zone = text(record.zone, 'National structure');
      const lga = text(record.lga, 'Not specified');
      const ward = text(record.ward, 'Not specified');
      const excerpt = text(record.short_info || record.excerpt || record.summary, 'Official leadership profile published by APSG Nigeria.');
      const credentials = text(record.credentials, 'Credentials and appointment notes will appear here once updated from the Admin Leadership Desk.');
      const biography = text(record.biography || record.bio || record.dossier, 'Full biography and official dossier will appear here once updated from the Admin Leadership Desk.');
      const image = getImage(record);
      const backLink = buildBackLink(record);
      const targets = getTargets(record);
      const updated = record.updated_at || record.created_at || '';
      const status = text(record.status, 'published');
      const profileSlug = profileKey(record);
      const placementCount = Array.isArray(placements) ? placements.length : 1;
      const placementHtml = (placements && placements.length ? placements : [record]).map(item => {
        const itemTargets = getTargets(item);
        return `<div class="placement-card"><strong>${escapeHtml(item.position || 'Official')}</strong><small>${escapeHtml(String(item.organization_key || item.organization || 'APSG').toUpperCase())} • ${escapeHtml(pretty(item.leadership_group || item.section_key || item.category || 'leadership'))} • ${escapeHtml(item.seat || 'Leadership Council')}</small><small>Targets: ${escapeHtml((itemTargets.length ? itemTargets : ['leadership']).map(pretty).join(', '))}</small></div>`;
      }).join('');

      document.title = `${name} | APSG Official Dossier`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', `${name} - ${role}. APSG official dossier.`);

      root.innerHTML = `
        <section class="dossier-hero text-white pt-24 md:pt-28 pb-14">
          <div class="hero-grid-pattern"></div>
          <div class="relative z-10 max-w-7xl mx-auto px-4 md:px-6">
            <div class="grid lg:grid-cols-[1fr_.72fr] gap-5 items-center compact-hero-layout">
              <div>
                <div class="flex flex-wrap gap-2">
                  <span class="official-chip dark"><i class="fa-solid fa-certificate"></i> Official Public Dossier</span>
                  <span class="official-chip dark"><i class="fa-solid fa-database"></i> ${escapeHtml(table)}</span>
                  <span class="official-chip dark"><i class="fa-solid fa-layer-group"></i> ${placementCount} Placement${placementCount === 1 ? '' : 's'}</span>
                </div>
                <h1 class="display-font mt-4 text-4xl md:text-5xl lg:text-6xl font-black leading-[.95] tracking-tight">${escapeHtml(name)}</h1>
                <p class="mt-3 inline-flex rounded-full border border-[#d8ad34]/35 bg-[#d8ad34]/15 px-4 py-2 text-xs md:text-sm font-black text-[#f8dc7a]">${escapeHtml(role)}</p>
                <p class="mt-3 max-w-2xl text-white/76 text-sm md:text-base leading-relaxed">${escapeHtml(excerpt)}</p>
                <div class="mt-5 flex flex-wrap gap-2 no-print">
                  <a href="${backLink}" class="action-btn bg-[#d8ad34] text-[#05351f] shadow-gold"><i class="fa-solid fa-arrow-left"></i> Back to Directory</a>
                  <button id="copyDossierBtn" type="button" class="action-btn border border-white/15 bg-white/10 text-white hover:bg-white/15"><i class="fa-solid fa-copy"></i> Copy Dossier</button>
                  <button type="button" onclick="window.print()" class="action-btn border border-white/15 bg-white/10 text-white hover:bg-white/15"><i class="fa-solid fa-print"></i> Print</button>
                </div>
              </div>
              <div class="glass-card compact-hero-card">
                <figure class="portrait-frame compact-portrait-frame">
                  <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" onerror="this.src='${FALLBACK_IMAGE}'">
                  <figcaption class="compact-profile-caption absolute left-5 right-5 bottom-5 z-10 rounded-[1.5rem] border border-white/15 bg-black/35 p-4 backdrop-blur-md">
                    <p class="text-[10px] uppercase tracking-[.25em] text-[#f8dc7a] font-black">Leadership Identity</p>
                    <p class="mt-1 text-xl font-black text-white">${escapeHtml(category)}</p>
                  </figcaption>
                </figure>
              </div>
            </div>
          </div>
        </section>

        <section class="relative z-20 -mt-7 px-3 md:px-5 pb-10">
          <div class="max-w-7xl mx-auto premium-shell compact-shell rounded-[2.2rem] overflow-hidden">
            <div class="grid lg:grid-cols-[18rem_1fr] compact-dossier-layout">
              <aside class="compact-dossier-sidebar bg-gradient-to-b from-[#05351f] to-[#07140e] text-white p-5 lg:min-h-full no-print">
                <div class="lg:sticky lg:top-6">
                  <div class="compact-sidebar-head flex items-center gap-3 mb-5">
                    <div class="compact-sidebar-icon grid h-12 w-12 place-items-center rounded-2xl bg-[#d8ad34] text-[#05351f] shadow-gold"><i class="bi bi-person-badge-fill text-lg"></i></div>
                    <div>
                      <p class="text-[10px] uppercase tracking-[.24em] text-white/45 font-black">Dossier Desk</p>
                      <h2 class="text-lg font-black">Profile Tools</h2>
                    </div>
                  </div>
                  <nav class="side-nav compact-side-nav space-y-2" aria-label="Dossier navigation">
                    <a class="active" href="#overview"><span>Overview</span><i class="fa-solid fa-chevron-right text-xs"></i></a>
                    <a href="#credentials"><span>Credentials</span><i class="fa-solid fa-chevron-right text-xs"></i></a>
                    <a href="#biography"><span>Biography</span><i class="fa-solid fa-chevron-right text-xs"></i></a>
                    <a href="#placements"><span>All Placements</span><i class="fa-solid fa-chevron-right text-xs"></i></a>
                    <a href="#placement"><span>Public Placement</span><i class="fa-solid fa-chevron-right text-xs"></i></a>
                  </nav>
                  <div class="compact-status-card mt-5 rounded-3xl border border-[#d8ad34]/25 bg-[#d8ad34]/10 p-4">
                    <p class="text-[10px] uppercase tracking-[.24em] text-[#f8dc7a] font-black">Status</p>
                    <p class="mt-2 text-2xl font-black">${escapeHtml(pretty(status))}</p>
                    <p class="mt-1 text-xs text-white/58">Live official profile from Admin Leadership Desk.</p>
                  </div>
                </div>
              </aside>

              <main class="compact-main p-5 md:p-8 lg:p-10 space-y-8">
                <section id="overview" class="overview-premium-card">
                  <div class="compact-section-head mb-4 flex flex-col md:flex-row md:items-end md:justify-between gap-3">
                    <div class="overview-title-wrap">
                      <span class="overview-title-icon"><i class="fa-solid fa-id-card-clip"></i></span>
                      <div>
                        <p class="section-label-premium"><i class="fa-solid fa-circle-check"></i> Official Overview</p>
                        <h2 class="display-font compact-section-title mt-2 text-3xl md:text-5xl font-black text-[#05351f] tracking-tight">Leadership Profile</h2>
                      </div>
                    </div>
                    <span class="overview-verification-badge"><i class="fa-solid fa-shield-halved"></i> Verified Display</span>
                  </div>
                  <div class="overview-grid-premium compact-info-grid">
                    ${infoCard('Designation', role, 'fa-user-tie')}
                    ${infoCard('Category', category, 'fa-layer-group')}
                    ${infoCard('Council / Seat', seat, 'fa-landmark')}
                    ${infoCard('State', state, 'fa-location-dot')}
                  </div>
                </section>

                <section class="content-card compact-content-card summary-premium-card rounded-[2rem] p-5 md:p-7">
                  <p class="section-label-premium"><i class="fa-solid fa-scroll"></i> Executive Summary</p>
                  <div class="gold-line my-4"></div>
                  <p class="compact-summary-text text-lg leading-8 text-slate-700 font-semibold">${escapeHtml(excerpt)}</p>
                </section>

                <section id="credentials" class="content-card compact-content-card rounded-[2rem] p-5 md:p-7">
                  <p class="text-xs uppercase tracking-[.28em] text-[#8a6616] font-black">Credentials & Recognition</p>
                  <h3 class="display-font mt-1 text-2xl md:text-3xl font-black text-[#05351f]">Official Credentials</h3>
                  <div class="gold-line my-5"></div>
                  <div class="prose-content compact-prose dossier-rich-content">${formatCredentialList(credentials)}</div>
                </section>

                <section id="biography" class="content-card compact-content-card rounded-[2rem] p-5 md:p-7">
                  <p class="text-xs uppercase tracking-[.28em] text-[#8a6616] font-black">Full Biography / Dossier</p>
                  <h3 class="display-font mt-1 text-2xl md:text-3xl font-black text-[#05351f]">Public Leadership Dossier</h3>
                  <div class="gold-line my-5"></div>
                  <div class="prose-content compact-prose dossier-rich-content">${formatParagraphs(biography)}</div>
                </section>

                <section id="placements" class="content-card compact-content-card rounded-[2rem] p-5 md:p-7">
                  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                    <div>
                      <p class="text-xs uppercase tracking-[.28em] text-[#8a6616] font-black">Profile Map</p>
                      <h3 class="display-font mt-1 text-2xl md:text-3xl font-black text-[#05351f]">All Leadership Placements</h3>
                    </div>
                    <span class="profile-map-badge"><i class="fa-solid fa-fingerprint"></i> ${escapeHtml(profileSlug)}</span>
                  </div>
                  <div class="gold-line my-5"></div>
                  <div class="placement-stack">${placementHtml}</div>
                </section>

                <section id="placement" class="compact-placement-grid grid lg:grid-cols-2 gap-4">
                  <div class="content-card compact-content-card rounded-[2rem] p-5 md:p-7">
                    <p class="text-xs uppercase tracking-[.28em] text-[#8a6616] font-black">Territory Details</p>
                    <div class="compact-mini-grid mt-5 grid sm:grid-cols-2 gap-3">
                      ${miniCard('Zone', zone)}${miniCard('LGA / LCDA', lga)}${miniCard('Ward', ward)}${miniCard('Display Order', text(record.display_order, '999'))}
                    </div>
                  </div>
                  <div class="content-card compact-content-card rounded-[2rem] p-5 md:p-7">
                    <p class="text-xs uppercase tracking-[.28em] text-[#8a6616] font-black">Publish Targets</p>
                    <div class="mt-5 flex flex-wrap gap-2">${(targets.length ? targets : ['leadership']).map(t => `<span class="rounded-full border border-[#0f7a3d]/15 bg-[#0f7a3d]/10 px-4 py-2 text-xs font-black uppercase tracking-[.14em] text-[#05351f]">${escapeHtml(pretty(t))}</span>`).join('')}</div>
                    <p class="mt-5 text-sm text-slate-500">${updated ? `Last updated: ${escapeHtml(new Date(updated).toLocaleString())}` : 'Update timestamp unavailable.'}</p>
                  </div>
                </section>
              </main>
            </div>
          </div>
        </section>`;

      record.__placements = placements;
      document.getElementById('copyDossierBtn')?.addEventListener('click', () => copyDossier(record));
    }

    function infoCard(label, value, icon) {
      return `<div class="info-card"><div class="info-icon"><i class="fa-solid ${icon} text-sm"></i></div><p class="info-label">${escapeHtml(label)}</p><p class="info-value">${escapeHtml(value)}</p></div>`;
    }
    function miniCard(label, value) {
      return `<div class="rounded-xl border border-[#0f7a3d]/10 bg-slate-50 p-3"><p class="text-[9px] uppercase tracking-[.18em] text-slate-400 font-black">${escapeHtml(label)}</p><p class="mt-1 text-sm font-black text-[#05351f]">${escapeHtml(value)}</p></div>`;
    }
    function renderError(error) {
      root.innerHTML = `<section class="dossier-hero text-white pt-32 pb-24"><div class="relative z-10 max-w-4xl mx-auto px-4 md:px-6 text-center"><span class="official-chip dark"><i class="fa-solid fa-triangle-exclamation"></i> Dossier Not Found</span><h2 class="display-font mt-5 text-4xl md:text-6xl font-black">Official profile could not be loaded.</h2><p class="mt-5 text-white/72 leading-relaxed">Check that the URL contains a valid UUID id and slug, and that the official is published in the Admin Leadership Desk.</p><a href="/pages/leadership.html" class="action-btn mt-8 bg-[#d8ad34] text-[#05351f]"><i class="fa-solid fa-arrow-left"></i> Back to Leadership</a><p class="mt-5 text-xs text-white/38">${escapeHtml(error?.message || '')}</p></div></section>`;
    }

    document.addEventListener('DOMContentLoaded', loadOfficial);
  </script>
  <script src="/assets/js/supabase-clients.js"></script>
  <script src="/assets/js/apsg-settings.js"></script>
  <script type="module" src="/components/navbar.js"></script>
  <script type="module" src="/components/footer.js"></script>
  <script src="/assets/js/deployment-polish.js" defer></script>
</body>
</html>
