    :root{--deep:#05351f;--green:#0f7a3d;--gold:#d8ad34;--cream:#fffaf0;--muted:#64746a;--line:rgba(5,53,31,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 8%,rgba(216,173,52,.18),transparent 28rem),linear-gradient(135deg,#fffdf8,#f7fbf6 55%,#f4ecdc);font-family:Inter,system-ui,sans-serif;color:#07140e}.display-font{font-family:"Playfair Display",Georgia,serif}.viewer-shell{width:min(100%,1200px);margin:0 auto;padding:1rem}.viewer-hero{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;border:1px solid rgba(5,53,31,.10);border-radius:1.35rem;background:linear-gradient(135deg,#05351f,#0f7a3d 70%,#0f766e);color:#fff;padding:1rem;box-shadow:0 24px 80px rgba(5,53,31,.15)}.brand{display:flex;align-items:center;gap:.7rem}.brand img{width:3rem;height:3rem;object-fit:contain;border-radius:1rem;background:#fff;padding:.25rem}.chip{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(216,173,52,.28);border-radius:999px;background:rgba(216,173,52,.13);color:#fff3c7;padding:.38rem .65rem;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:950}.viewer-hero h1{margin:.5rem 0 0;font-size:clamp(2rem,5vw,4rem);line-height:.96}.viewer-hero p{color:rgba(255,255,255,.76);font-weight:650}.actions{display:flex;gap:.55rem;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(5,53,31,.12);min-height:2.55rem;padding:.65rem .9rem;border-radius:999px;background:#fff;color:#05351f;font-weight:950;cursor:pointer;text-decoration:none}.btn.gold{background:linear-gradient(135deg,#d8ad34,#f7db78)}.viewer-grid{display:grid;grid-template-columns:20rem 1fr;gap:.9rem;margin-top:.9rem;align-items:start}.panel{border:1px solid rgba(5,53,31,.10);border-radius:1.15rem;background:rgba(255,255,255,.9);box-shadow:0 14px 42px rgba(5,53,31,.09);padding:.9rem}.field{border:1px solid rgba(5,53,31,.10);border-radius:.95rem;background:linear-gradient(145deg,#fff,#fffaf0);padding:.65rem;margin-bottom:.5rem}.field span{display:block;color:#64748b;font-size:.55rem;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.field strong{display:block;margin-top:.22rem;color:#05351f;font-size:.82rem;font-weight:900;overflow-wrap:anywhere}.pdf-frame{height:calc(100vh - 10rem);min-height:620px;border:1px solid rgba(5,53,31,.12);border-radius:1.15rem;overflow:hidden;background:#f8fafc;box-shadow:0 24px 80px rgba(5,53,31,.12)}.pdf-frame iframe{width:100%;height:100%;border:0}.toast{position:fixed;right:1rem;bottom:1rem;z-index:10;transform:translateY(1rem);opacity:0;transition:.2s;border-radius:1rem;background:#05351f;color:#fff;padding:.8rem .95rem;box-shadow:0 18px 50px rgba(5,53,31,.22);font-weight:850}.toast.show{transform:translateY(0);opacity:1}@media(max-width:920px){.viewer-hero,.viewer-grid{grid-template-columns:1fr}.pdf-frame{height:70vh;min-height:0}.actions .btn{width:100%;justify-content:center}}

  <script>
    const $=id=>document.getElementById(id);let currentReceipt=null,currentDoc=null,currentUrl=null;const LOGOS=['/assets/images/logo/apsg.png','/assets/images/logo/apsg1.png'];function toast(m){const b=$('toast');b.textContent=m;b.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>b.classList.remove('show'),1800)}function clean(v){return String(v==null?'':v).trim()}function money(v){const raw=clean(v).replace(/[₦,\s]/g,'');const n=Number(raw);return Number.isFinite(n)&&n>0?'₦'+n.toLocaleString('en-NG'):clean(v)||'₦0'}function safe(v,f='—'){return clean(v)||f}function pdfName(r){return `${(r.receipt_ref||'apsg-receipt').replace(/[^a-z0-9-]+/gi,'-')}.pdf`}function client(){return window.supabaseClient||window.apsgSupabase||window.APSG_SUPABASE||null}async function waitClient(){for(let i=0;i<25;i++){const c=client();if(c&&typeof c.from==='function')return c;await new Promise(r=>setTimeout(r,100))}return null}function blobToDataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}async function loadLogo(){for(const u of LOGOS){try{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)continue;const b=await r.blob();if(String(b.type||'').startsWith('image/'))return await blobToDataUrl(b)}catch(e){}}return''}function formatImg(d){return /^data:image\/jpe?g/i.test(String(d||''))?'JPEG':'PNG'}function drawLogo(doc,data,x,y,size){try{if(data){doc.addImage(data,formatImg(data),x,y,size,size);return}}catch(e){}doc.setFillColor(255,255,255);doc.roundedRect(x,y,size,size,12,12,'F');doc.setTextColor(5,53,31);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('APSG',x+8,y+size/2+5)}function normalizeReceipt(r){r=r||{};return{receipt_ref:r.receipt_ref||r.receiptRef||r.receipt_number||'',payment_ref:r.payment_ref||r.paymentRef||'',source_ref:r.source_ref||r.sourceRef||r.donation_ref||r.sponsorship_ref||'',supporter_ref:r.supporter_ref||r.supporterRef||r.donor_ref||'',recipient_name:r.recipient_name||r.recipientName||r.donor_name||r.sponsor_name||'APSG Supporter',phone:r.phone||r.recipient_phone||'',email:r.email||r.recipient_email||'',state_chapter:r.state_chapter||r.stateChapter||r.state||'',support_category:r.support_category||r.supportCategory||r.impact_area||r.package_name||'APSG General Support',amount:r.amount||0,source_type:r.source_type||r.sourceType||'support',receipt_status:r.receipt_status||r.receiptStatus||r.status||'pending',receipt_mode:r.receipt_mode||r.receiptMode||'',transfer_sender_name:r.transfer_sender_name||r.transferSender||'',receipt_note:r.receipt_note||r.receiptNote||'This is a pending payment confirmation receipt. Final receipt will be issued after APSG confirms the bank transfer.'}}async function fetchReceipt(ref){let r=null;try{r=JSON.parse(sessionStorage.getItem('apsg_receipt_payload_'+ref)||'null')||JSON.parse(sessionStorage.getItem('apsg_receipt_view_payload')||'null')}catch(e){}if(r)return normalizeReceipt(r);const c=await waitClient();if(c&&ref){try{let q=await c.from('apsg_payment_receipts').select('*').eq('receipt_ref',ref).maybeSingle();if(q.data)return normalizeReceipt(q.data);let d=await c.from('apsg_donations').select('*').or(`receipt_ref.eq.${ref},payment_ref.eq.${ref},donation_ref.eq.${ref}`).limit(1).maybeSingle();if(d.data)return normalizeReceipt(d.data);let s=await c.from('apsg_sponsorships').select('*').or(`receipt_ref.eq.${ref},payment_ref.eq.${ref},sponsorship_ref.eq.${ref}`).limit(1).maybeSingle();if(s.data)return normalizeReceipt(s.data)}catch(e){}}return normalizeReceipt({receipt_ref:ref||'APSG-RCP',recipient_name:'APSG Supporter',amount:0})}async function buildPdf(r){const PDF=window.jspdf?.jsPDF||window.jsPDF;if(!PDF){toast('PDF engine loading. Try again.');return null}const logo=await loadLogo();const doc=new PDF({orientation:'portrait',unit:'pt',format:'a4'}),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight(),deep=[5,53,31],green=[15,122,61],gold=[216,173,52],muted=[100,116,105],cream=[255,250,240];doc.setFillColor(...deep);doc.rect(0,0,w,126,'F');doc.setFillColor(...green);doc.triangle(w,0,w,126,w-215,0,'F');doc.setFillColor(...gold);doc.rect(0,122,w,4,'F');drawLogo(doc,logo,42,29,58);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('APC Progressive Support Group',116,48);doc.setFontSize(8);doc.setTextColor(236,244,238);doc.text('OFFICIAL APSG SUPPORT RECEIPT',116,66);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(`Issued: ${new Date().toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})}`,116,82);doc.setFillColor(255,255,255);doc.roundedRect(w-178,36,136,32,16,16,'F');doc.setTextColor(...deep);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(String(r.receipt_status||'pending').toUpperCase(),w-160,56);doc.setTextColor(236,240,236);doc.setFontSize(64);doc.text(['final','confirmed'].includes(String(r.receipt_status).toLowerCase())?'FINAL':'PENDING',w/2,287,{align:'center',angle:-22});doc.setTextColor(...deep);doc.setFont('helvetica','bold');doc.setFontSize(30);doc.text(r.receipt_mode?String(r.receipt_mode).replace(/_/g,' ').toUpperCase():'Support Receipt',42,166,{maxWidth:w-84});doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...muted);doc.text('Generated by APSG Receipt Studio for finance/admin verification and official record keeping.',42,184,{maxWidth:w-84});doc.setDrawColor(230,235,230);doc.line(42,202,w-42,202);function box(x,y,bw,bh,label,value){doc.setDrawColor(218,224,218);doc.setFillColor(...cream);doc.roundedRect(x,y,bw,bh,10,10,'FD');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(112,128,120);doc.text(String(label).toUpperCase(),x+12,y+18);doc.setFontSize(10);doc.setTextColor(...deep);doc.text(safe(value),x+12,y+39,{maxWidth:bw-24})}box(42,222,246,62,'Receipt Reference',r.receipt_ref);box(306,222,246,62,'Payment Reference',r.payment_ref);box(42,296,246,62,'Source Reference',r.source_ref);box(306,296,246,62,'Donor / Sponsor Reference',r.supporter_ref);box(42,370,246,62,'Received From',r.recipient_name);box(306,370,246,62,'Phone / Email',[r.phone,r.email].filter(Boolean).join(' • '));box(42,444,246,62,'Support Type',r.source_type);box(306,444,246,62,'Support Category',r.support_category);doc.setFillColor(255,250,240);doc.setDrawColor(...gold);doc.roundedRect(42,526,w-84,78,14,14,'FD');doc.setTextColor(126,86,16);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('AMOUNT / DECLARED SUPPORT VALUE',58,552);doc.setTextColor(...deep);doc.setFontSize(27);doc.text(money(r.amount),58,580,{maxWidth:w-245});doc.setFillColor(...deep);doc.roundedRect(w-190,552,132,27,13,13,'F');doc.setTextColor(255,255,255);doc.setFontSize(8);doc.text(String(r.source_type||'support').toUpperCase(),w-174,569);box(42,626,246,62,'State / Chapter',r.state_chapter);box(306,626,246,62,'Transfer Sender',r.transfer_sender_name);doc.setFillColor(255,255,255);doc.setDrawColor(218,224,218);doc.roundedRect(42,704,w-84,70,10,10,'FD');doc.setTextColor(112,128,120);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text('OFFICIAL RECEIPT NOTE',58,724);doc.setTextColor(...deep);doc.setFontSize(10);doc.text(safe(r.receipt_note,''),58,746,{maxWidth:w-116});doc.setDrawColor(210,218,210);doc.line(42,h-82,w-42,h-82);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...muted);doc.text('This receipt is valid only when the reference exists in APSG administrative records. Manual bank transfer verification remains required unless a payment gateway is later integrated.',42,h-61,{maxWidth:w-180});doc.setFont('helvetica','bold');doc.setTextColor(...deep);doc.text('APSG Authorized Finance Desk',w-196,h-45);doc.setDrawColor(...deep);doc.line(w-222,h-60,w-42,h-60);return doc}function renderMeta(r){$('viewerSub').textContent=`Viewing ${safe(r.receipt_ref)} for ${safe(r.recipient_name)}.`;$('dataPanel').innerHTML=[['Receipt Ref',r.receipt_ref],['Payment Ref',r.payment_ref],['Source Ref',r.source_ref],['Recipient',r.recipient_name],['Support',r.support_category],['Amount / Value',money(r.amount)],['Status',r.receipt_status],['State',r.state_chapter],['Note',r.receipt_note]].map(([a,b])=>`<div class="field"><span>${a}</span><strong>${safe(b)}</strong></div>`).join('')}async function renderPdf(){const doc=await buildPdf(currentReceipt);if(!doc)return;currentDoc=doc;const blob=doc.output('blob');if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(blob);$('pdfFrame').src=currentUrl;toast('PDF rendered')}function downloadPdf(){if(!currentDoc)return toast('PDF still loading');currentDoc.save(pdfName(currentReceipt));toast('Receipt PDF downloaded')}async function reloadFromRef(){const params=new URLSearchParams(location.search);const ref=params.get('ref')||params.get('payment')||'';currentReceipt=await fetchReceipt(ref);renderMeta(currentReceipt);await renderPdf()}window.addEventListener('beforeunload',()=>{if(currentUrl)URL.revokeObjectURL(currentUrl)});document.addEventListener('DOMContentLoaded',reloadFromRef);
  </script>
